<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" role="img" aria-labelledby="ae-hero-title ae-hero-desc">
  <title id="ae-hero-title">AI Email Client</title>
  <desc id="ae-hero-desc">Full-stack Gmail client built with React, GitHub Primer, and Express with OAuth 2.0 and split-pane reading.</desc>
  <style>
    .ae-hero-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ae-hero-eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: #58a6ff;
    }
    .ae-hero-display {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
      fill: #e6edf3;
    }
    .ae-hero-accent {
      fill: #58a6ff;
    }
    .ae-hero-sub {
      font-size: 15px;
      fill: #8b949e;
    }
    .ae-hero-tagline-1,
    .ae-hero-tagline-2,
    .ae-hero-tagline-3 {
      opacity: 0;
      animation: ae-hero-cycle 10.5s ease-in-out infinite;
    }
    .ae-hero-tagline-1 { animation-delay: 0s; }
    .ae-hero-tagline-2 { animation-delay: 3.5s; }
    .ae-hero-tagline-3 { animation-delay: 7s; }

    @keyframes ae-hero-cycle {
      0% { opacity: 0; transform: translateY(4px); }
      5%, 28% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    .ae-hero-pill {
      fill: none;
      stroke: #30363d;
      stroke-width: 1.25;
      animation: ae-hero-pill-wave 7.5s ease-in-out infinite;
    }
    .ae-hero-pill-text {
      font-size: 13px;
      font-weight: 500;
      fill: #c9d1d9;
      animation: ae-hero-text-wave 7.5s ease-in-out infinite;
    }
    .ae-hero-p1 { animation-delay: 0s; }
    .ae-hero-p2 { animation-delay: 1.5s; }
    .ae-hero-p3 { animation-delay: 3.0s; }
    .ae-hero-p4 { animation-delay: 4.5s; }
    .ae-hero-p5 { animation-delay: 6.0s; }

    @keyframes ae-hero-pill-wave {
      0%, 100% { stroke: #30363d; stroke-width: 1.25; }
      10%, 22% { stroke: #58a6ff; stroke-width: 1.8; }
    }
    @keyframes ae-hero-text-wave {
      0%, 100% { fill: #c9d1d9; }
      10%, 22% { fill: #58a6ff; }
    }

    .ae-hero-dot {
      fill: #58a6ff;
      animation: ae-hero-pulse 2.2s ease-in-out infinite;
    }
    .ae-hero-ring {
      fill: none;
      stroke: #58a6ff;
      stroke-width: 1.2;
      animation: ae-hero-ring-expand 2.2s ease-out infinite;
    }
    .ae-hero-cursor {
      fill: #58a6ff;
      animation: ae-hero-blink 1.1s steps(2, start) infinite;
    }
    @keyframes ae-hero-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @keyframes ae-hero-ring-expand {
      0% { r: 4.5; opacity: 0.8; }
      100% { r: 11; opacity: 0; }
    }
    @keyframes ae-hero-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-color-scheme: light) {
      .ae-hero-eyebrow { fill: #0969da; }
      .ae-hero-display { fill: #24292f; }
      .ae-hero-accent { fill: #0969da; }
      .ae-hero-sub { fill: #57606a; }
      .ae-hero-dot, .ae-hero-cursor { fill: #0969da; }
      .ae-hero-ring { stroke: #0969da; }
      .ae-hero-pill { stroke: #d0d7de; animation-name: ae-hero-pill-wave-light; }
      .ae-hero-pill-text { fill: #24292f; animation-name: ae-hero-text-wave-light; }
    }
    @keyframes ae-hero-pill-wave-light {
      0%, 100% { stroke: #d0d7de; stroke-width: 1.25; }
      10%, 22% { stroke: #0969da; stroke-width: 1.8; }
    }
    @keyframes ae-hero-text-wave-light {
      0%, 100% { fill: #24292f; }
      10%, 22% { fill: #0969da; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ae-hero-dot, .ae-hero-ring, .ae-hero-cursor,
      .ae-hero-pill, .ae-hero-pill-text,
      .ae-hero-tagline-2, .ae-hero-tagline-3 {
        animation: none !important;
      }
      .ae-hero-tagline-1 {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
      .ae-hero-tagline-2, .ae-hero-tagline-3 {
        opacity: 0;
      }
      .ae-hero-ring { opacity: 0; }
    }
  </style>

  <g class="ae-hero-root" transform="translate(24, 32)">
    <circle class="ae-hero-ring" cx="6" cy="10" r="4.5" />
    <circle class="ae-hero-dot" cx="6" cy="10" r="4.5" />
    <text class="ae-hero-eyebrow" x="22" y="15">REACT 18 / PRIMER UI / EXPRESS / GMAIL API</text>

    <text class="ae-hero-display" x="0" y="76">
      AI Email <tspan class="ae-hero-accent">Client</tspan>
    </text>
    <rect class="ae-hero-cursor" x="356" y="38" width="4" height="42" rx="1" />

    <g>
      <text class="ae-hero-sub ae-hero-tagline-1" x="0" y="114">
        Split-pane Gmail reader with OAuth 2.0 authentication, resizable sidebar, and Primer dark/light theming.
      </text>
      <text class="ae-hero-sub ae-hero-tagline-2" x="0" y="114">
        Press '/' anywhere for instant inbox search, drag sidebar 280px to 800px, and persist theme state.
      </text>
      <text class="ae-hero-sub ae-hero-tagline-3" x="0" y="114">
        Express 4 + googleapis backend with recursive MIME HTML/plain-text decoding and read-state sync.
      </text>
    </g>

    <g transform="translate(0, 146)">
      <rect class="ae-hero-pill ae-hero-p1" x="0" y="0" width="128" height="32" rx="8" />
      <text class="ae-hero-pill-text ae-hero-p1" x="64" y="21" text-anchor="middle">@primer/react</text>

      <rect class="ae-hero-pill ae-hero-p2" x="140" y="0" width="108" height="32" rx="8" />
      <text class="ae-hero-pill-text ae-hero-p2" x="194" y="21" text-anchor="middle">Express 4</text>

      <rect class="ae-hero-pill ae-hero-p3" x="260" y="0" width="112" height="32" rx="8" />
      <text class="ae-hero-pill-text ae-hero-p3" x="316" y="21" text-anchor="middle">Gmail v1</text>

      <rect class="ae-hero-pill ae-hero-p4" x="384" y="0" width="104" height="32" rx="8" />
      <text class="ae-hero-pill-text ae-hero-p4" x="436" y="21" text-anchor="middle">OAuth 2.0</text>

      <rect class="ae-hero-pill ae-hero-p5" x="500" y="0" width="90" height="32" rx="8" />
      <text class="ae-hero-pill-text ae-hero-p5" x="545" y="21" text-anchor="middle">Vite 7</text>
    </g>
  </g>
</svg>
